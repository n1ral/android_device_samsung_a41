# dtbo.img entry table for a41, built by vendor/lineage/build/tasks/kernel.mk
# via mkdtboimg.py cfg_create against $(DTBO_OUT)/arch/arm64/boot/dts.
#
# Mirrors the stock dtbo.img: two overlay entries selected by the bootloader
# through custom[0]/custom[1] (dtbo-hw_rev/dtbo-hw_rev_end), page_size=2048,
# version=0, id=0/rev=0, no flags.

# Hardware revisions 0-2
mediatek/a41.dtb
  id=0
  rev=0
  flags=0
  custom0=0
  custom1=2
  custom2=0
  custom3=0

# Hardware revisions 3-32
mediatek/a41_r03.dtb
  id=0
  rev=0
  flags=0
  custom0=3
  custom1=32
  custom2=0
  custom3=0
