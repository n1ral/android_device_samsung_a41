# dtb.img entry table for a41, built by vendor/lineage/build/tasks/kernel.mk
# via mkdtboimg.py cfg_create against $(DTB_OUT)/arch/arm64/boot/dts.
#
# Mirrors the stock dtb.img: a single DT-table entry wrapping the base
# mt6768 dtb, page_size=2048, version=0, id=0/rev=0, no custom fields.
# (Keeps the DT-table format instead of a raw cat of *.dtb, which would
# also pick up the overlay blobs a41.dtb/a41_r03.dtb.)

mediatek/mt6768.dtb
  id=0
  rev=0
  flags=0
  custom0=0
  custom1=0
  custom2=0
  custom3=0
